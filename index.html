<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Suma Interactiva</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 25px; border-radius: 8px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button { margin: 10px; padding: 10px; font-size: 16px; }
        button { background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Calculadora Web</h2>
        <input type="number" id="num1" placeholder="Primer número"><br>
        <input type="number" id="num2" placeholder="Segundo número"><br>
        <button onclick="sumar()">Sumar</button>
        <h3 id="resultado"></h3>
    </div>
    <script>
        function sumar() {
            let n1 = parseFloat(document.getElementById('num1').value) || 0;
            let n2 = parseFloat(document.getElementById('num2').value) || 0;
            let total = n1 + n2;
            document.getElementById('resultado').innerText = "Resultado: " + total;
        }
    </script>
</body>
</html>
